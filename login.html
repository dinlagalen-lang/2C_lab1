<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <style>
      :root {
        --bg-1: #0f172a;
        --bg-2: #1e293b;
        --card: rgba(15, 23, 42, 0.72);
        --card-2: rgba(15, 23, 42, 0.4);
        --primary: #7c3aed;
        --primary-2: #a78bfa;
        --accent: #22c55e;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --border: rgba(148, 163, 184, 0.2);
        --input: rgba(15, 23, 42, 0.8);
        --shadow: 0 24px 60px rgba(15, 23, 42, 0.4);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top left, rgba(124, 58, 237, 0.4), transparent 25%),
          radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.2), transparent 25%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--text);
      }

      .login-shell {
        width: min(980px, 92vw);
        min-height: 660px;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        background: rgba(15, 23, 42, 0.55);
        border: 1px solid var(--border);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .welcome-panel {
        position: relative;
        padding: 54px 42px;
        background: linear-gradient(160deg, rgba(124, 58, 237, 0.32), rgba(15, 23, 42, 0.8));
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .welcome-panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><circle cx="160" cy="30" r="90" fill="rgba(168,85,247,0.16)"/><circle cx="40" cy="170" r="110" fill="rgba(34,197,94,0.10)"/></svg>') center/cover no-repeat;
      }

      .topbar,
      .welcome-content,
      .feature-list {
        position: relative;
        z-index: 1;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f8fafc;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        box-shadow: 0 10px 25px rgba(124, 58, 237, 0.6);
        font-size: 1.1rem;
      }

      .welcome-content {
        margin-top: 60px;
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 16px;
        color: #c4b5fd;
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 2.3vw + 1rem, 4rem);
        line-height: 1.08;
        letter-spacing: -0.06em;
      }

      .welcome-copy {
        margin-top: 18px;
        max-width: 470px;
        font-size: 1.05rem;
        line-height: 1.75;
        color: rgba(226, 232, 240, 0.8);
      }

      .feature-list {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 28px;
      }

      .feature-pill {
        padding: 12px 16px;
        border-radius: 999px;
        border: 1px solid rgba(196, 181, 253, 0.18);
        background: rgba(15, 23, 42, 0.3);
        color: #f8fafc;
        font-size: 0.9rem;
      }

      .login-panel {
        background: rgba(15, 23, 42, 0.74);
        padding: 48px 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-card {
        width: min(100%, 360px);
      }

      .title-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      h2 {
        margin: 0;
        font-size: 2rem;
        letter-spacing: -0.05em;
      }

      .subtitle {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 0.96rem;
      }

      .social-buttons {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 22px;
      }

      .social-btn {
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
        padding: 12px 14px;
        border-radius: 12px;
        font-size: 0.96rem;
        cursor: pointer;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .social-btn:hover {
        transform: translateY(-1px);
        border-color: rgba(167, 139, 250, 0.7);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin: 22px 0;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        border-top: 1px solid var(--border);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 0.85rem;
        color: #dbe4f2;
      }

      input {
        width: 100%;
        background: var(--input);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 14px;
        font-size: 1rem;
        color: var(--text);
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        border-color: rgba(167, 139, 250, 0.9);
        box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.12);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: -6px;
      }

      .checkbox {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 0.84rem;
      }

      .checkbox input {
        width: 16px;
        height: 16px;
        accent-color: var(--primary);
      }

      .link {
        color: #c4b5fd;
        text-decoration: none;
        font-size: 0.84rem;
      }

      .primary-btn {
        margin-top: 8px;
        border: none;
        border-radius: 12px;
        padding: 15px 18px;
        font-size: 1rem;
        font-weight: 700;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
        cursor: pointer;
        box-shadow: 0 16px 28px rgba(124, 58, 237, 0.45);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .primary-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 20px 34px rgba(124, 58, 237, 0.5);
      }

      .signup {
        margin-top: 18px;
        text-align: center;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .signup a {
        color: #ddd6fe;
        font-weight: 600;
        text-decoration: none;
      }

      @media (max-width: 820px) {
        .login-shell {
          grid-template-columns: 1fr;
          min-height: auto;
        }

        .welcome-panel {
          padding: 36px 24px 26px;
        }

        .login-panel {
          padding: 28px 24px 38px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <section class="welcome-panel">
        <div class="topbar">
          <div class="brand">
            <span class="brand-mark">L</span>
            <span>Logix</span>
          </div>
        </div>

        <div class="welcome-content">
          <span class="eyebrow">Welcome back</span>
          <h1>Access your account.</h1>
          <p class="welcome-copy">
            Manage your projects, keep track of progress, and continue where you left off with a secure and personalized workspace.
          </p>
          <div class="feature-list">
            <span class="feature-pill">Fast onboarding</span>
            <span class="feature-pill">Secure access</span>
            <span class="feature-pill">Smart dashboard</span>
          </div>
        </div>
      </section>

      <section class="login-panel">
        <div class="login-card">
          <div class="title-row">
            <h2>Login</h2>
          </div>
          <p class="subtitle">Enter your details below</p>

          <div class="social-buttons">
            <button class="social-btn" type="button">Google</button>
            <button class="social-btn" type="button">GitHub</button>
          </div>

          <div class="divider">or</div>

          <form>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" type="email" placeholder="you@example.com" />
            </div>

            <div class="field">
              <label for="password">Password</label>
              <input id="password" type="password" placeholder="Enter your password" />
            </div>

            <div class="row">
              <label class="checkbox">
                <input type="checkbox" />
                <span>Remember me</span>
              </label>
              <a href="#" class="link">Forgot password?</a>
            </div>

            <button class="primary-btn" type="submit">Sign in</button>
          </form>

          <p class="signup">
            Don’t have an account? <a href="#">Create one</a>
          </p>
        </div>
      </section>
    </div>
  </body>
</html>
